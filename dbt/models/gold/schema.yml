version: 2

models:
  - name: smoke_gold
    description: Skeleton model from M1.2 so `dbt build` runs end to end before the real gold models arrive. One row.
    columns:
      - name: layer
        description: The layer this model lives in.
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ["gold"]
      - name: layer_order
        description: Position of the layer in the pipeline, 1 for bronze.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [3]
                quote: false
      - name: built_on_target
        description: The dbt target that built the row, duckdb or dev.
        data_tests:
          - not_null

# Downtime causes. category and planned follow the spec table; minutes are the
# typical range; weights steer the random filler per machine (0 = never from
# the filler). Causes the generator plants explicitly (missplice schedule,
# Chicago stacker jams, boiler, power outage, PM, knife change) are listed
# with planted: true and get no filler weight on those machines.
downtime_causes:
  - { code: Missplice, category: Operator, planned: false, minutes: [4, 12], section: wet end, planted: true }
  - { code: Roll prep wrong, category: Operator, planned: false, minutes: [10, 20], section: wet end, weights: { ATL-C1: 0.14, ATL-C2: 0.14, CHI-C1: 0.05, PA-C1: 0.05, LA-C1: 0.08 }, third_shift_multiplier: { ATL: 2.5 } }
  - { code: Paper or raw material problem, category: Operator, planned: false, minutes: [10, 30], section: wet end, weights: { ATL-C1: 0.08, ATL-C2: 0.08, CHI-C1: 0.18, PA-C1: 0.10, LA-C1: 0.22 } }
  - { code: "Order change, grade change", category: Operator, planned: true, minutes: [3, 8], section: wet end, planted: true }
  - { code: Web break, category: Maintenance, planned: false, minutes: [15, 45], section: bridge, weights: { ATL-C1: 0.22, ATL-C2: 0.10, CHI-C1: 0.16, PA-C1: 0.12, LA-C1: 0.10 }, winter_multiplier: { CHI: 2.2 } }
  - { code: "Slitter blade wobble, score drift", category: Maintenance, planned: false, minutes: [10, 30], section: slitter-scorer, weights: { ATL-C1: 0.05, ATL-C2: 0.05, CHI-C1: 0.06, PA-C1: 0.08, LA-C1: 0.30 } }
  - { code: Air pressure loss, category: Maintenance, planned: false, minutes: [10, 40], section: double backer, weights: { ATL-C1: 0.06, ATL-C2: 0.22, CHI-C1: 0.05, PA-C1: 0.08, LA-C1: 0.06 } }
  - { code: Boiler or steam issue, category: Maintenance, planned: false, minutes: [30, 180], section: double backer, planted: true }
  - { code: Stacker jam, category: Maintenance, planned: false, minutes: [5, 15], section: stacker, planted: true, weights: { ATL-C1: 0.08, ATL-C2: 0.08, CHI-C1: 0.0, PA-C1: 0.10, LA-C1: 0.06 } }
  - { code: Discharge or conveyor fault, category: Maintenance, planned: false, minutes: [10, 30], section: conveyor, weights: { ATL-C1: 0.08, ATL-C2: 0.08, CHI-C1: 0.20, PA-C1: 0.27, LA-C1: 0.08 } }
  - { code: Knife change, category: Maintenance, planned: true, minutes: [20, 40], section: knife, planted: true }
  - { code: Preventive maintenance, category: Management, planned: true, minutes: [60, 120], section: wet end, planted: true }
  - { code: Power outage, category: Management, planned: false, minutes: [30, 200], section: null, planted: true }
  - { code: "No orders, waiting on schedule", category: Management, planned: true, minutes: [30, 120], section: null, planted: true }
  - { code: Waiting on forklift or paper delivery, category: Management, planned: false, minutes: [5, 15], section: wet end, weights: { ATL-C1: 0.29, ATL-C2: 0.25, CHI-C1: 0.30, PA-C1: 0.20, LA-C1: 0.10 } }

# How the planned-downtime share that is not PM or knife change is split
# between machines (as order-change and no-orders stops). PF-17 fixes the
# companywide planned share.
planned_flex_weights: { ATL-C1: 0.04, ATL-C2: 0.04, CHI-C1: 0.70, PA-C1: 0.04, LA-C1: 0.18 }

# Missplice events per machine per month. ATL-C1 is scheduled explicitly so
# that June-August 2025 is the largest three-month window (PF-01).
missplice_per_month:
  default: { ATL-C1: 6, ATL-C2: 3, CHI-C1: 4, PA-C1: 2, LA-C1: 3 }
  ATL-C1:
    2025-06: 15
    2025-07: 16
    2025-08: 15
    2025-12: 4
    2026-01: 4
    2026-02: 4
    2026-06: 12
    2026-07: 12
    2026-08: 11

# Boiler failures hit both Atlanta machines at once. The 212-minute one on
# 14 January 2026 is PF-18. Power outages are Atlanta summer storms.
boiler_events:
  - { date: 2026-01-14, shift_no: 1, start: "09:15", minutes: 212 }
  - { date: 2025-02-11, shift_no: 2, start: "16:40", minutes: 95 }
  - { date: 2025-08-19, shift_no: 3, start: "02:10", minutes: 64 }
  - { date: 2026-06-03, shift_no: 1, start: "07:30", minutes: 140 }
power_outages:
  - { date: 2025-06-24, shift_no: 2, start: "17:05", minutes: 85 }
  - { date: 2025-07-15, shift_no: 2, start: "15:50", minutes: 150 }
  - { date: 2025-08-06, shift_no: 3, start: "23:20", minutes: 45 }
  - { date: 2026-06-30, shift_no: 2, start: "16:15", minutes: 110 }
  - { date: 2026-08-11, shift_no: 1, start: "13:05", minutes: 70 }

# Machine fault codes raised by the control system. Each implies a cause.
fault_codes:
  - { code: F-WE-012, section: wet end, description: "Splicer miss, roll stand 2", cause: Missplice }
  - { code: F-WE-013, section: wet end, description: "Splicer miss, roll stand 1", cause: Missplice }
  - { code: F-WE-031, section: wet end, description: Roll stand tension fault, cause: Paper or raw material problem }
  - { code: F-BR-004, section: bridge, description: "Web break, bridge", cause: Web break }
  - { code: F-SF-009, section: wet end, description: "Web break, single facer", cause: Web break }
  - { code: F-SS-021, section: slitter-scorer, description: Slitter blade wobble, cause: "Slitter blade wobble, score drift" }
  - { code: F-SS-022, section: slitter-scorer, description: Score alignment drift, cause: "Slitter blade wobble, score drift" }
  - { code: F-DB-007, section: double backer, description: Low plant air pressure, cause: Air pressure loss }
  - { code: F-DB-015, section: double backer, description: Hot plate steam pressure low, cause: Boiler or steam issue }
  - { code: F-ST-002, section: stacker, description: Lower stacker jam, cause: Stacker jam }
  - { code: F-ST-003, section: stacker, description: Upper stacker jam, cause: Stacker jam }
  - { code: F-CV-005, section: conveyor, description: Discharge conveyor fault, cause: Discharge or conveyor fault }
  - { code: F-CV-006, section: discharge, description: Discharge photo-eye blocked, cause: Discharge or conveyor fault }
  - { code: F-KN-001, section: knife, description: Knife blade change required, cause: Knife change }
  - { code: F-PW-000, section: null, description: Main power loss, cause: Power outage }

# Deliberate messiness. Each item is numbered as in docs/domain-spec.md
# section 11 and documented in data/README.md. Rates are fractions.
messiness:
  cause_spellings:            # item 1: variants by canonical cause
    Missplice: [missplice, Mis-splice, splice miss, SPLICE, Misplice]
    Web break: [web break, Web Break, WEB BRK, webbreak]
    Stacker jam: [stacker jam, Stacker Jam, jam - stacker, STACKER, lower stacker jam]
    Roll prep wrong: [roll prep, Roll Prep Wrong, bad roll prep]
    Paper or raw material problem: [paper problem, Paper, bad paper, raw material]

# Generator configuration. Every value here comes from docs/domain-spec.md;
# change the spec and this file together. Planted-fact targets live in
# data/planted_facts.yaml and are read by the generator as well as the tests.

company:
  name: Ironwood Container
  period_start: 2024-11-01
  period_end: 2026-10-31

calendar:
  # Three shifts, Monday through Friday. Saturday first shift is overtime in
  # the Q4 peak at Atlanta and Pennsylvania. Weekend maintenance happens
  # outside scheduled time and is not logged as a stop event.
  shifts:
    - { shift_no: 1, start: "06:00", minutes: 480 }
    - { shift_no: 2, start: "14:00", minutes: 480 }
    - { shift_no: 3, start: "22:00", minutes: 480 }
  overtime_saturdays:
    plants: [ATL, PA]
    months: [10, 11]
    probability: 0.5
  holidays:
    - 2024-11-28
    - 2024-11-29
    - 2024-12-24
    - 2024-12-25
    - 2025-01-01
    - 2025-05-26
    - 2025-07-04
    - 2025-09-01
    - 2025-11-27
    - 2025-11-28
    - 2025-12-24
    - 2025-12-25
    - 2026-01-01
    - 2026-05-25
    - 2026-07-03
    - 2026-09-07

plants:
  - code: ATL
    name: Atlanta
    city: Atlanta
    state: GA
    timezone: America/New_York
    commissioned_year: 2002
    data_start: 2024-11-01
    market: High-volume brown box, long sheet runs, one anchor customer on a partnership agreement
    character: The star. Oldest equipment, best numbers. High labor turnover shows up as higher setup time and waste on third shift
    wet_end_runs_per_shift: 3.2        # PF-08
    wet_end_run_length_ft: 38500       # PF-07
    width_resets_per_shift: 1.1
    orders_per_wet_end_run: 2.2
    waste_pct_by_shift: { 1: 3.1, 2: 3.6, 3: 4.8 }   # PF-06 pins shifts 1 and 3
    order_change_stop_fraction: 0.10
  - code: CHI
    name: Chicago
    city: Chicago
    state: IL
    timezone: America/Chicago
    commissioned_year: 2009
    data_start: 2024-11-01
    market: Specialty - E flute, double wall, preprinted liner, short runs, customers close by
    character: The problem child. Many short wet-end runs and hard transitions in and out of specialty grades. Board stored on trailers in winter, moisture problems
    wet_end_runs_per_shift: 11.4       # PF-08
    wet_end_run_length_ft: 9200        # PF-07
    width_resets_per_shift: 2.7        # PF-09
    orders_per_wet_end_run: 1.4
    waste_pct_by_shift: { 1: 5.2, 2: 5.4, 3: 5.9 }
    order_change_stop_fraction: 0.22
  - code: PA
    name: Pennsylvania
    city: Carlisle
    state: PA
    timezone: America/New_York
    commissioned_year: 2014
    data_start: 2024-11-01
    market: Volume for the I-95 and I-81 corridor, long runs, distribution-center customers
    character: Steady. Good equipment, mid-range on everything. The control plant
    wet_end_runs_per_shift: 5.2
    wet_end_run_length_ft: 31000       # PF-07
    width_resets_per_shift: 0.9        # PF-09
    orders_per_wet_end_run: 2.0
    waste_pct_by_shift: { 1: 3.3, 2: 3.4, 3: 3.8 }
    order_change_stop_fraction: 0.08
  - code: LA
    name: Los Angeles
    city: Ontario
    state: CA
    timezone: America/Los_Angeles
    commissioned_year: 2025
    data_start: 2025-07-01
    market: Specialty produce packaging - fruit and vegetable sheets, moisture-resistant grades, one dominant customer
    character: Newest. Still ramping, so early months are noisy
    wet_end_runs_per_shift: 4.6
    wet_end_run_length_ft: 14600       # PF-07
    width_resets_per_shift: 1.0
    orders_per_wet_end_run: 1.6
    waste_pct_by_shift: { 1: 5.0, 2: 5.2, 3: 5.6 }
    order_change_stop_fraction: 0.12

machines:
  - code: ATL-C1
    plant: ATL
    width_in: 110
    commissioned_year: 2002
    nominal_speed_fpm: 800
    capability: "Single and double wall: B, C, BC"
    weak_spot: Splicer on roll stand 2 misses intermittently, more in humid months. Short stops and a web break every few weeks
    roll_widths_in: [110, 105, 100, 95, 90]
    uptime_pct: 93.6
    grade_mix: { 32ECT-C: 0.36, 29ECT-C: 0.10, 40ECT-C: 0.12, 44ECT-C: 0.22, 200C: 0.07, 51ECT-BC: 0.09, 48ECT-BC: 0.04 }
    speed_factor: 0.96
  - code: ATL-C2
    plant: ATL
    width_in: 98
    commissioned_year: 2006
    nominal_speed_fpm: 800
    capability: "Single wall: B and C"
    weak_spot: Cutoff knife 2 does not hold accuracy below 21 inch cutoff. Short-blank orders go to C1 or run with higher waste
    roll_widths_in: [98, 93, 88, 83, 78]
    uptime_pct: 94.3
    grade_mix: { 32ECT-C: 0.48, 29ECT-C: 0.16, 40ECT-C: 0.12, 44ECT-C: 0.19, 200C: 0.05 }
    speed_factor: 0.94
    short_cutoff_fraction: 0.06      # PF-16: runs with cutoff under 21 inches
  - code: CHI-C1
    plant: CHI
    width_in: 98
    commissioned_year: 2009
    nominal_speed_fpm: 900
    capability: "E, B, C, BC, EB; preprinted liner"
    weak_spot: Lower stacker jams on short sheets and E flute. Frequent short stops, the plant's biggest downtime cause
    roll_widths_in: [98, 93, 88, 83, 78]
    uptime_pct: 86.9
    grade_mix: { 26ECT-B: 0.12, 32ECT-B: 0.20, 32ECT-E: 0.15, 48ECT-BC: 0.14, 51ECT-BC: 0.12, 71ECT-BC: 0.06, 32ECT-C: 0.11, 29ECT-C: 0.05, 44ECT-C: 0.05 }
    speed_factor: 0.92
  - code: PA-C1
    plant: PA
    width_in: 110
    commissioned_year: 2014
    nominal_speed_fpm: 1000
    capability: Single and double wall
    weak_spot: None chronic. The control machine
    roll_widths_in: [110, 105, 100, 95, 90]
    uptime_pct: 95.8                  # PF-03, the only machine above 95
    grade_mix: { 32ECT-C: 0.40, 29ECT-C: 0.12, 40ECT-C: 0.12, 44ECT-C: 0.20, 275C: 0.06, 48ECT-BC: 0.10 }
    speed_factor: 0.95
  - code: LA-C1
    plant: LA
    width_in: 98
    commissioned_year: 2025
    nominal_speed_fpm: 1000
    capability: "B, C, BC; food-grade and moisture-resistant liners"
    weak_spot: Slitter-scorer score alignment drifts, causing score-line quality rejects. Ramp-up noise through 2025
    roll_widths_in: [98, 93, 88, 83, 78]
    uptime_pct: 90.8
    grade_mix: { 32ECT-C: 0.30, 44ECT-C-MR: 0.45, 44ECT-C: 0.10, 40ECT-C: 0.05, 48ECT-BC: 0.10 }
    speed_factor: 0.85

# Recipes are liner/medium/liner basis weights in pounds. speed_factor scales
# the machine nominal speed; starch_lb_per_msf is the companywide typical value.
grades:
  - { code: 26ECT-B, flute: B, recipe: 26/23/26, test_basis: ECT, test_target: 26, caliper_in: 0.125, speed_factor: 0.92, price_per_msf: 17.5, cost_per_msf: 14.4, starch_lb_per_msf: 2.4, runs_mainly_at: Chicago, notes: Light e-commerce mailers }
  - { code: 29ECT-C, flute: C, recipe: 33/23/33, test_basis: ECT, test_target: 29, caliper_in: 0.172, speed_factor: 0.95, price_per_msf: 18.5, cost_per_msf: 15.3, starch_lb_per_msf: 2.6, runs_mainly_at: "ATL, PA", notes: Light RSC }
  - { code: 32ECT-C, flute: C, recipe: 35/26/35, test_basis: ECT, test_target: 32, caliper_in: 0.175, speed_factor: 0.96, price_per_msf: 20.0, cost_per_msf: 16.6, starch_lb_per_msf: 2.7, runs_mainly_at: "ATL, PA, LA", notes: "The volume grade, about 40% of all lineal feet" }
  - { code: 32ECT-B, flute: B, recipe: 35/26/35, test_basis: ECT, test_target: 32, caliper_in: 0.128, speed_factor: 0.90, price_per_msf: 21.5, cost_per_msf: 17.6, starch_lb_per_msf: 2.6, runs_mainly_at: Chicago, notes: "Print surface, retail" }
  - { code: 40ECT-C, flute: C, recipe: 42/26/42, test_basis: ECT, test_target: 40, caliper_in: 0.178, speed_factor: 0.93, price_per_msf: 24.0, cost_per_msf: 19.9, starch_lb_per_msf: 2.8, runs_mainly_at: "ATL, PA", notes: Heavier shipping }
  - { code: 44ECT-C, flute: C, recipe: 42/30/42, test_basis: ECT, test_target: 44, caliper_in: 0.180, speed_factor: 0.92, price_per_msf: 27.5, cost_per_msf: 22.6, starch_lb_per_msf: 2.9, runs_mainly_at: "ATL, PA", notes: "Second volume grade: furniture, appliances" }
  - { code: 44ECT-C-MR, flute: C, recipe: 42/30/42 wet-strength liner, test_basis: ECT, test_target: 44, caliper_in: 0.180, speed_factor: 0.85, price_per_msf: 46.0, cost_per_msf: 36.5, starch_lb_per_msf: 3.5, runs_mainly_at: LA, notes: "Moisture-resistant produce grade, higher starch, wax-alternative coating" }
  - { code: 200C, flute: C, recipe: 42/26/42, test_basis: Mullen, test_target: 200, caliper_in: 0.178, speed_factor: 0.93, price_per_msf: 23.5, cost_per_msf: 19.6, starch_lb_per_msf: 2.8, runs_mainly_at: ATL, notes: Legacy Mullen customers }
  - { code: 275C, flute: C, recipe: 69/33/69, test_basis: Mullen, test_target: 275, caliper_in: 0.185, speed_factor: 0.85, price_per_msf: 33.0, cost_per_msf: 27.2, starch_lb_per_msf: 3.0, runs_mainly_at: PA, notes: "Legacy heavy Mullen" }
  - { code: 48ECT-BC, flute: BC, recipe: 42/26/26/26/42, test_basis: ECT, test_target: 48, caliper_in: 0.300, speed_factor: 0.70, price_per_msf: 37.0, cost_per_msf: 30.0, starch_lb_per_msf: 4.9, runs_mainly_at: "Chicago, PA", notes: Entry double wall }
  - { code: 51ECT-BC, flute: BC, recipe: 42/26/33/26/42, test_basis: ECT, test_target: 51, caliper_in: 0.305, speed_factor: 0.64, price_per_msf: 41.0, cost_per_msf: 33.2, starch_lb_per_msf: 5.1, runs_mainly_at: "Chicago, ATL-C1", notes: "Cabinets, furniture. Harder to run" }
  - { code: 71ECT-BC, flute: BC, recipe: 69/33/33/33/69, test_basis: ECT, test_target: 71, caliper_in: 0.320, speed_factor: 0.50, price_per_msf: 52.0, cost_per_msf: 42.0, starch_lb_per_msf: 5.6, runs_mainly_at: Chicago, notes: "Heaviest. Slow, high waste, few customers" }
  - { code: 32ECT-E, flute: E, recipe: 35/26/35, test_basis: ECT, test_target: 32, caliper_in: 0.062, speed_factor: 0.62, price_per_msf: 26.0, cost_per_msf: 21.4, starch_lb_per_msf: 2.2, runs_mainly_at: Chicago, notes: "Small retail, often preprinted liner" }

# Paper price increases: standard cost per MSF steps up for every grade on the
# first of the month. Price follows with a lag unless the contract has no
# escalator (the Atlanta anchor).
cost_increases:
  - { month: 2025-03, pct: 6.1 }     # PF-13
  - { month: 2026-02, pct: 5.8 }
price_lag_months: 2
anchor_price_lag_months: 3            # Atlanta anchor moved in June 2025, not May


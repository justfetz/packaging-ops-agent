  fact: Highest-margin customer over the period is a Chicago furniture maker at 22.4%; lowest is the Atlanta anchor at 9.8%.
  tables: [orders]
  definition: Margin as in PF-13 per customer over the full period.
  expected:
    highest_customer: C007
    highest_margin_pct: 22.4
    lowest_customer: C001
    lowest_margin_pct: 9.8

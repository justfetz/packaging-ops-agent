name: Authenticate to Google Cloud
description: >-
  Authenticate the job to Google Cloud with Workload Identity Federation.
  GitHub mints an OIDC token for the job, Google's Security Token Service
  checks it against the pool provider Terraform created, and the job gets a
  short-lived token for the CI service account. No key is stored anywhere.
  The calling job must set `permissions: id-token: write`.
inputs:
  workload_identity_provider:
    description: >-
      Full resource name of the Workload Identity Pool Provider. Terraform
      output `ci_workload_identity_provider` in infra/terraform/envs/<env>.
    required: false
    default: projects/925041489941/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
  service_account:
    description: >-
      Service account to impersonate. Terraform output
      `ci_service_account_email` in infra/terraform/envs/<env>.
    required: false
    default: github-ci@packaging-ops-agent-dev.iam.gserviceaccount.com
runs:
  using: composite
  steps:
    # Writes an external_account credential file and points
    # GOOGLE_APPLICATION_CREDENTIALS and gcloud at it, which is all the
    # google Terraform provider, the GCS backend, gcloud, and bq need.
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
